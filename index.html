<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Connectivity Monitoring System | Sign In</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-box">

        <div class="auth-header">
            <div class="crest">ICMS</div>
            <h1>Institution Connectivity Monitoring System</h1>
            <p>Live connectivity monitoring for institutions</p>
        </div>

        <div class="auth-body">

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">
                    Sign In
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm">
                <div class="auth-field">
                    <label>Email or Username</label>
                    <input type="text" id="loginEmail" placeholder="you@example.com or username" autocomplete="username">
                </div>   
                <div class="auth-field">
                    <label>Password</label>
                    <div style="display:flex;align-items:center;gap:8px">
                        <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" id="loginTogglePwd" onclick="togglePassword('loginPassword','loginTogglePwd')" class="pwd-toggle">Show</button>
                    </div>
                </div>

                <div class="auth-error" id="loginError"></div>

                <button class="btn-auth-primary" id="loginBtn" onclick="handleLogin()">
                    Sign In
                </button>

                <div style="text-align:right;margin:10px 0 8px">
                    <a href="#" onclick="showResetPanel();return false" style="font-size:12px;color:var(--navy-deep);font-weight:600">Reset password</a>
                </div>

                <div id="resetPasswordPanel" style="display:none;margin-top:10px">
                    <div class="auth-field">
                        <label>Email or Username</label>
                        <input type="text" id="resetIdentifier" placeholder="Enter your email or username">
                    </div>
                    <div class="auth-field">
                        <label>New Password</label>
                        <div style="display:flex;align-items:center;gap:8px">
                            <input type="password" id="resetPassword" placeholder="New password">
                            <button type="button" id="resetTogglePwd" onclick="togglePassword('resetPassword','resetTogglePwd')" class="pwd-toggle">Show</button>
                        </div>
                    </div>
                    <button class="btn-auth-primary" onclick="handlePasswordReset()">Update Password</button>
                    <div class="auth-error" id="resetError"></div>
                </div>

                <!-- Google sign-in disabled in this deployment -->
            </div>

            <!-- Signup disabled. Admin will create user accounts. -->

        </div>
    </div>
</div>

<div id="toast"></div>

<script src="static/js/api.js"></script>
<script src="static/js/auth.js"></script>

</body>
</html>
