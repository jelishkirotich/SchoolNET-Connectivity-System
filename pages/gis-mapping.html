<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolNET | GIS Mapping</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/gis.css">

    <!-- LEAFLET MAP CSS -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>🌐 SchoolNET</h1>
            <p>Connectivity Management</p>
        </div>
        <nav>
            <a href="../index.html" class="nav-link">
                📊 Dashboard
            </a>
            <a href="school-registry.html" class="nav-link">
                🏫 School Registry
            </a>
            <a href="gis-mapping.html" class="nav-link active">
                🗺️ GIS Mapping
            </a>
            <a href="reports.html" class="nav-link">
                📄 Reports
            </a>
            <a href="administration.html" class="nav-link">
                👤 Administration
            </a>
            <a href="../login.html" class="nav-link logout">
                🚪 Logout
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">
            <h2>GIS Mapping</h2>
            <div class="topbar-right">
                <span>North Rift Region</span>
                <div class="user-badge">AD</div>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- MAP FILTERS -->
            <div class="map-filters">

                <div class="filter-group">
                    <label>County</label>
                    <select id="mapCounty" onchange="renderMap()">
                        <option value="">All Counties</option>
                        <option>Turkana</option>
                        <option>Nandi</option>
                        <option>Baringo</option>
                        <option>West Pokot</option>
                        <option>Trans Nzoia</option>
                        <option>Uasin Gishu</option>
                        <option>Elgeyo Marakwet</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Status</label>
                    <select id="mapStatus" onchange="renderMap()">
                        <option value="">All Statuses</option>
                        <option>Connected</option>
                        <option>Scheduled</option>
                        <option>Not Connected</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Type</label>
                    <select id="mapType" onchange="renderMap()">
                        <option value="">All Types</option>
                        <option>PUBLIC</option>
                        <option>PRIVATE</option>
                    </select>
                </div>

                <!-- MAP LEGEND -->
                <div class="map-legend">
                    <div class="legend-item">
                        <div class="legend-dot green"></div>
                        <span>Connected</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot orange"></div>
                        <span>Scheduled</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot red"></div>
                        <span>Not Connected</span>
                    </div>
                </div>

                <!-- MAP COUNT -->
                <span id="mapCount" class="map-count"></span>

            </div>

            <!-- MAP -->
            <div id="mapContainer"></div>

        </div>
    </div>

    <!-- LEAFLET MAP JS -->
    <script 
        src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js">
    </script>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/gisMap.js"></script>

</body>
</html>
