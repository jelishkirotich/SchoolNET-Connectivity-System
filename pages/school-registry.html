<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolNET | School Registry</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/registry.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>🌐 SchoolNET</h1>
            <p>Connectivity Management</p>
        </div>
        <nav>
            <a href="../index.html" class="nav-link">
                📊 Dashboard
            </a>
            <a href="school-registry.html" class="nav-link active">
                🏫 School Registry
            </a>
            <a href="gis-mapping.html" class="nav-link">
                🗺️ GIS Mapping
            </a>
            <a href="reports.html" class="nav-link">
                📄 Reports
            </a>
            <a href="administration.html" class="nav-link">
                👤 Administration
            </a>
            <a href="../login.html" class="nav-link logout">
                🚪 Logout
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">
            <h2>School Registry</h2>
            <div class="topbar-right">
                <span>North Rift Region</span>
                <div class="user-badge">AD</div>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- TABLE CARD -->
            <div class="table-card">

                <!-- TOOLBAR -->
                <div class="toolbar">
                    <h3>All Schools</h3>
                    <div class="toolbar-right">

                        <!-- SEARCH -->
                        <input 
                            type="text" 
                            id="searchBox" 
                            placeholder="Search school name or NEMIS..."
                            oninput="searchSchools()"
                        >

                        <!-- FILTER BY COUNTY -->
                        <select id="filterCounty" onchange="searchSchools()">
                            <option value="">All Counties</option>
                            <option>Turkana</option>
                            <option>Nandi</option>
                            <option>Baringo</option>
                            <option>West Pokot</option>
                            <option>Trans Nzoia</option>
                            <option>Uasin Gishu</option>
                            <option>Elgeyo Marakwet</option>
                        </select>

                        <!-- FILTER BY STATUS -->
                        <select id="filterStatus" onchange="searchSchools()">
                            <option value="">All Statuses</option>
                            <option>Connected</option>
                            <option>Scheduled</option>
                            <option>Not Connected</option>
                        </select>

                        <!-- ADD BUTTON -->
                        <button class="btn-add" onclick="openAddModal()">
                            + Add School
                        </button>

                    </div>
                </div>

                <!-- TABLE -->
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>School Name</th>
                                <th>NEMIS</th>
                                <th>County</th>
                                <th>Sub County</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="registryBody">
                        </tbody>
                    </table>

                    <!-- NO RESULTS -->
                    <div id="noResults" style="display:none">
                        No schools found.
                    </div>

                </div>

                <!-- PAGINATION -->
                <div class="pagination">
                    <span id="pgInfo"></span>
                    <div id="pgBtns"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-bg" id="schoolModal">
        <div class="modal">

            <div class="modal-header">
                <h3 id="modalTitle">Add School</h3>
                <button onclick="closeModal()">×</button>
            </div>

            <div class="modal-body">
                <div class="form-grid">

                    <div class="form-group full">
                        <label>School Name</label>
                        <input type="text" id="fName" 
                        placeholder="e.g. KAINUK GIRLS JSS">
                    </div>

                    <div class="form-group">
                        <label>NEMIS Code</label>
                        <input type="text" id="fNemis" 
                        placeholder="e.g. XGWH">
                    </div>

                    <div class="form-group">
                        <label>Type</label>
                        <select id="fType">
                            <option>PUBLIC</option>
                            <option>PRIVATE</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>County</label>
                        <select id="fCounty">
                            <option>Turkana</option>
                            <option>Nandi</option>
                            <option>Baringo</option>
                            <option>West Pokot</option>
                            <option>Trans Nzoia</option>
                            <option>Uasin Gishu</option>
                            <option>Elgeyo Marakwet</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Sub County</label>
                        <input type="text" id="fSubCounty">
                    </div>

                    <div class="form-group">
                        <label>Zone</label>
                        <input type="text" id="fZone">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="fStatus">
                            <option>Not Connected</option>
                            <option>Scheduled</option>
                            <option>Connected</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Status Detail</label>
                        <input type="text" id="fStatusDetail" 
                        placeholder="e.g. Scheduled(UNICEF)">
                    </div>

                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="text" id="fLat" 
                        placeholder="e.g. 1.7802">
                    </div>

                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="text" id="fLng" 
                        placeholder="e.g. 35.508">
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" 
                onclick="closeModal()">Cancel</button>
                <button class="btn-save" 
                onclick="saveSchool()">Save School</button>
            </div>

        </div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/schoolRegistry.js"></script>

</body>
</html>
