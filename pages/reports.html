<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolNET | Reports</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/reports.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>🌐 SchoolNET</h1>
            <p>Connectivity Management</p>
        </div>
        <nav>
            <a href="../index.html" class="nav-link">
                📊 Dashboard
            </a>
            <a href="school-registry.html" class="nav-link">
                🏫 School Registry
            </a>
            <a href="gis-mapping.html" class="nav-link">
                🗺️ GIS Mapping
            </a>
            <a href="reports.html" class="nav-link active">
                📄 Reports
            </a>
            <a href="administration.html" class="nav-link">
                👤 Administration
            </a>
            <a href="../login.html" class="nav-link logout">
                🚪 Logout
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">
            <h2>Reports & Analytics</h2>
            <div class="topbar-right">
                <span>North Rift Region</span>
                <div class="user-badge">AD</div>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content">

            <!-- SUMMARY CARDS -->
            <div class="stats-grid" id="reportStats"></div>

            <!-- COUNTY REPORTS -->
            <div class="table-card" style="margin-bottom:24px">
                <div class="table-header">
                    <h3>County Connectivity Report</h3>
                    <button class="btn-export" onclick="exportCSV()">
                        ⬇ Export CSV
                    </button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>County</th>
                                <th>Total Schools</th>
                                <th>Connected</th>
                                <th>Scheduled</th>
                                <th>Not Connected</th>
                                <th>Coverage %</th>
                                <th>Progress</th>
                            </tr>
                        </thead>
                        <tbody id="countyReport"></tbody>
                    </table>
                </div>
            </div>

            <!-- COUNTY BAR CHART -->
            <div class="chart-card">
                <h3>Schools Per County</h3>
                <div id="barChart"></div>
            </div>

        </div>
    </div>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/reports.js"></script>

</body>
</html>
